sonar.projectKey=truemark
sonar.projectName=TrueMark
sonar.projectVersion=0.1.0

sonar.sources=apps,packages
sonar.tests=apps
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,apps/e2e/**/*
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/test-results/**,**/prisma/migrations/**,project.md

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=apps/api/tsconfig.json

# Set SONAR_HOST_URL and SONAR_TOKEN when running against SonarCloud/SonarQube server.
# Example: sonar-scanner -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=your-org
