apiVersion: v2
name: truemark
description: TrueMark enterprise product authentication and anti-counterfeit platform
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - truemark
  - product-authentication
  - anti-counterfeit
  - qr-verification
home: https://github.com/truemark/truemark
sources:
  - https://github.com/truemark/truemark
maintainers:
  - name: TrueMark Engineering
    email: engineering@truemark.io
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
