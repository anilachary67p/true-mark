# TrueMark On-Premises Full Stack
# Usage: docker compose -f infra/docker/docker-compose.onprem.yml up -d

services:
  # ─── Data Layer ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: truemark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truemark_dev_password}
      POSTGRES_DB: truemark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truemark -d truemark"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - truemark

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - truemark

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-truemark_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-truemark_minio_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - truemark

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set truemark http://minio:9000 $${MINIO_ROOT_USER:-truemark_minio} $${MINIO_ROOT_PASSWORD:-truemark_minio_secret};
        mc mb truemark/truemark --ignore-existing;
        mc anonymous set none truemark/truemark;
        echo 'MinIO bucket initialized';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-truemark_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-truemark_minio_secret}
    networks:
      - truemark

  # ─── Application Layer ───────────────────────────────────────────────────

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://truemark:${POSTGRES_PASSWORD:-truemark_dev_password}@postgres:5432/truemark
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_HOST: 0.0.0.0
      AUTH_MODE: ${AUTH_MODE:-dev}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-minimum-32-characters-long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-truemark_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-truemark_minio_secret}
      MINIO_BUCKET: truemark
      MINIO_USE_SSL: "false"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-http://localhost:3000}
      CONSUMER_WEB_URL: ${CONSUMER_WEB_URL:-http://localhost:3002}
      RATE_LIMIT_VERIFY_PER_MIN: ${RATE_LIMIT_VERIFY_PER_MIN:-60}
      RATE_LIMIT_AI_PER_MIN: ${RATE_LIMIT_AI_PER_MIN:-10}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - truemark

  admin-web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${ADMIN_WEB_PORT:-3000}:3000"
    networks:
      - truemark

  consumer-web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.consumer-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${CONSUMER_WEB_PORT:-3002}:3002"
    networks:
      - truemark

  # BullMQ workers run in-process within the API service (JobsModule).

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin-web
      - consumer-web
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/onprem.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - truemark

  # ─── Monitoring (Optional) ─────────────────────────────────────────────────

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - truemark

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3003:3000"
    networks:
      - truemark

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  truemark:
    driver: bridge
